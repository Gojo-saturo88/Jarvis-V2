
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="JARVIS - Your personal AI assistant">
  <title>JARVIS AI</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <a href="./" class="brand">
          <span class="brand-icon">J</span>
          <span>JARVIS</span>
        </a>
        <button class="icon-button" id="collapseSidebar" title="Close sidebar">☰</button>
      </div>

      <button class="new-chat" id="newChatBtn">
        <span>＋</span> New chat
      </button>

      <div class="side-label">YOUR CHATS</div>
      <div class="history-list" id="historyList"></div>

      <div class="sidebar-bottom">
        <div class="profile">
          <div class="profile-avatar">J</div>
          <div class="profile-info">
            <strong>JARVIS AI</strong>
            <span>Personal assistant</span>
          </div>
          <button class="icon-button" id="settingsBtn" title="Settings">⚙</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-toggle" id="openSidebar" title="Open sidebar">☰</button>

        <div class="model-label">
          <span>JARVIS</span>
          <span class="model-version">AI</span>
        </div>

        <div class="top-actions">
          <span class="connection-status">
            <i id="statusDot"></i>
            <span id="systemStatus">Ready</span>
          </span>

          <div class="menu-wrap">
            <button class="icon-button dots-button" id="menuBtn" aria-label="More options" aria-expanded="false">•••</button>
            <div class="dropdown" id="mainMenu" hidden>
              <button data-action="history">◷ &nbsp; Chat history</button>
              <button data-action="tools">⌘ &nbsp; Tools</button>
              <button data-action="new">＋ &nbsp; New chat</button>
              <button data-action="clear">⌫ &nbsp; Clear current chat</button>
              <button data-action="settings">⚙ &nbsp; Settings</button>
            </div>
          </div>
        </div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-mark">
            <div class="logo-orbit orbit-a"></div>
            <div class="logo-orbit orbit-b"></div>
            <div class="logo-core">J</div>
          </div>

          <p class="overline">YOUR PERSONAL AI</p>
          <h1>What can I help you with?</h1>
          <p class="welcome-subtitle">
            Ask questions, explore ideas, search the web or build something new.
          </p>

          <div class="suggestions">
            <button class="suggestion" data-prompt="Search the latest technology news">
              <span class="suggestion-icon">↗</span>
              <span><strong>Latest news</strong><small>Explore what's happening</small></span>
            </button>
            <button class="suggestion" data-prompt="Explain photosynthesis step by step">
              <span class="suggestion-icon">✳</span>
              <span><strong>Learn something</strong><small>Understand a topic</small></span>
            </button>
            <button class="suggestion" data-prompt="Write a simple HTML website">
              <span class="suggestion-icon">&lt;/&gt;</span>
              <span><strong>Write code</strong><small>Build a new project</small></span>
            </button>
            <button class="suggestion" data-prompt="Give me five creative YouTube video ideas">
              <span class="suggestion-icon">✧</span>
              <span><strong>Get creative</strong><small>Find new ideas</small></span>
            </button>
          </div>
        </div>

        <div class="messages" id="chatMessages" aria-live="polite"></div>
      </section>

      <footer class="composer-area">
        <form class="composer" id="chatForm">
          <textarea id="chatInput" rows="1" placeholder="Message JARVIS..." aria-label="Message JARVIS"></textarea>

          <div class="composer-bottom">
            <div class="composer-tools">
              <div class="menu-wrap">
                <button type="button" class="tool-button" id="toolsBtn" aria-expanded="false">＋ <span>Tools</span></button>
                <div class="dropdown tools-dropdown" id="toolsMenu" hidden>
                  <button type="button" data-tool="search">⌕ &nbsp; Search the web</button>
                  <button type="button" data-tool="news">◉ &nbsp; Latest news</button>
                  <button type="button" data-tool="study">✳ &nbsp; Study helper</button>
                  <button type="button" data-tool="code">‹/› &nbsp; Coding helper</button>
                </div>
              </div>
              <button type="button" class="tool-button voice-button" id="voiceBtn" title="Voice input">♩ <span>Voice</span></button>
            </div>

            <button type="submit" class="send-button" id="sendBtn" aria-label="Send message">
              <span>↑</span>
            </button>
          </div>
        </form>
        <p class="disclaimer">JARVIS can make mistakes. Verify important information.</p>
      </footer>
    </main>
  </div>

  <div class="mobile-backdrop" id="mobileBackdrop"></div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Settings</h2>
        <button class="icon-button" id="closeModal" aria-label="Close">✕</button>
      </div>
      <div id="modalContent"></div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
